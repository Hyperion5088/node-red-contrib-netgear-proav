<script type="text/javascript">
  RED.nodes.registerType("netgear-proav-switch", {
    category: "config",
    defaults: {
      name: { value: "" },
      host: { value: "", required: true },
      port: { value: 443, required: true, validate: RED.validators.number() },
      verifySsl: { value: false },
      timeout: { value: 15000, required: true, validate: RED.validators.number() }
    },
    credentials: {
      username: { type: "text", required: true },
      password: { type: "password", required: true }
    },
    label: function () {
      return this.name || this.host || "NETGEAR Pro AV switch";
    }
  });

  RED.nodes.registerType("netgear-proav-control", {
    category: "network",
    color: "#3f6fb5",
    defaults: {
      name: { value: "" },
      switch: { value: "", type: "netgear-proav-switch", required: true },
      commandType: { value: "get", required: true },
      operation: { value: "deviceInfo", required: true },
      portId: { value: "" },
      enabled: { value: "" },
      description: { value: "" },
      fanMode: { value: "" },
      vlanId: { value: "" },
      statisticsType: { value: "errors" },
      saveOnReboot: { value: true }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-server",
    label: function () {
      return this.name || this.operation || "NETGEAR Pro AV control";
    },
    oneditprepare: function () {
      const operations = {
        get: [
          ["deviceInfo", "Device info"],
          ["portConfig", "Port config"],
          ["portConfigAll", "All port config"],
          ["portsStatus", "Ports status"],
          ["portStatus", "Port status"],
          ["portStatistics", "Port statistics"],
          ["fiberOptics", "Fiber optics"],
          ["fiberOpticsDiag", "Fiber diagnostics"],
          ["fiberOpticsEeprom", "Fiber EEPROM"],
          ["imageInfo", "Image info"],
          ["neighbors", "LLDP neighbors"],
          ["profileList", "Profile list"],
          ["poeInfo", "PoE info"],
          ["poePortConfig", "PoE port config"],
          ["lagConfig", "LAG config"],
          ["stacking", "Stacking"],
          ["vlanMembership", "VLAN membership"]
        ],
        set: [
          ["saveConfig", "Save config"],
          ["reboot", "Reboot"],
          ["setFanMode", "Set fan mode"],
          ["setPortAdmin", "Set port admin"],
          ["setPortDescription", "Set port description"],
          ["setPoeEnabled", "Set PoE enabled"],
          ["resetPoe", "Reset PoE"]
        ]
      };
      const commandType = $("#node-input-commandType");
      const select = $("#node-input-operation");
      const switchSelect = $("#node-input-switch");
      const portSelect = $("#node-input-portId");
      const allOperations = operations.get.concat(operations.set).map(([value]) => value);
      const initialOperation = allOperations.includes(this.operation) ? this.operation : "deviceInfo";
      const initialType = operations.set.some(([value]) => value === initialOperation) ? "set" : "get";
      const initialPortId = this.portId || "";
      commandType.val(this.commandType || initialType);

      const populateOperations = function (selected) {
        const type = commandType.val() || "get";
        const current = selected || select.val() || initialOperation;
        const validCurrent = operations[type].some(([value]) => value === current);
        const nextValue = validCurrent ? current : operations[type][0][0];
        select.empty();
        for (const [value, label] of operations[type]) {
          $("<option></option>").val(value).text(label).appendTo(select);
        }
        select.val(nextValue);
      };

      const updateVisibility = function () {
        const op = select.val();
        $(".netgear-port-row").toggle(["portConfig", "poePortConfig", "setPortAdmin", "setPortDescription", "setPoeEnabled", "resetPoe"].includes(op));
        $(".netgear-enabled-row").toggle(["setPortAdmin", "setPoeEnabled"].includes(op));
        $(".netgear-description-row").toggle(op === "setPortDescription");
        $(".netgear-fan-row").toggle(op === "setFanMode");
        $(".netgear-vlan-row").toggle(op === "vlanMembership");
        $(".netgear-statistics-row").toggle(op === "portStatistics");
        $(".netgear-reboot-row").toggle(op === "reboot");
      };

      const populatePorts = function () {
        const switchId = switchSelect.val();
        const current = portSelect.val() || initialPortId;
        portSelect.empty();
        $("<option></option>").val("").text("Use msg.portId").appendTo(portSelect);
        if (current) {
          $("<option></option>").val(current).text(`Current saved value (${current})`).appendTo(portSelect);
          portSelect.val(current);
        }
        if (!switchId || switchId === "_ADD_") {
          return;
        }
        $("<option></option>").val("").text("Loading ports...").prop("disabled", true).appendTo(portSelect);
        $.getJSON(`netgear-proav/switch/${encodeURIComponent(switchId)}/ports`)
          .done(function (data) {
            const selected = portSelect.val() || current;
            portSelect.empty();
            $("<option></option>").val("").text("Use msg.portId").appendTo(portSelect);
            for (const port of data.ports || []) {
              $("<option></option>").val(port.value).text(port.label || port.value).appendTo(portSelect);
            }
            const hasSelected = portSelect.find("option").filter(function () {
              return $(this).val() === selected;
            }).length > 0;
            if (selected && !hasSelected) {
              $("<option></option>").val(selected).text(`Current saved value (${selected})`).appendTo(portSelect);
            }
            portSelect.val(selected);
          })
          .fail(function (xhr) {
            portSelect.find("option:disabled").remove();
            const message = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Could not load ports";
            $("<option></option>").val("").text(message).prop("disabled", true).appendTo(portSelect);
          });
      };
      commandType.on("change", function () {
        populateOperations();
        updateVisibility();
      });
      select.on("change", updateVisibility);
      switchSelect.on("change", populatePorts);
      populateOperations(initialOperation);
      populatePorts();
      updateVisibility();
    }
  });
</script>

<script type="text/html" data-help-name="netgear-proav-switch">
  <p>Shared connection settings for one NETGEAR Pro AV switch.</p>
  <p>Create one switch config node per physical switch, then reference it from as many NETGEAR Pro AV control nodes as needed. The config node owns the authenticated session and refreshes it before the switch session token expires.</p>
  <p>Create a dedicated switch user for automation. Avoid using the built-in admin account if NETGEAR Engage or browser management may be used at the same time, because those sessions can interfere with each other.</p>
  <p>Most switches use HTTPS on port 443. If the switch uses its factory self-signed certificate, leave SSL verification disabled unless you have installed a trusted certificate.</p>
</script>

<script type="text/html" data-template-name="netgear-proav-control">
  <div class="form-row">

      <option value="true">True</option>

    </select>
  </div>
  <div class="form-row netgear-description-row">

  <div class="form-row netgear-fan-row">

  <div class="form-row netgear-vlan-row">

  </div>
  <div class="form-row netgear-statistics-row">

  </div>
  <div class="form-row netgear-reboot-row">
    <label for="node-input-saveOnReboot"><i class="fa fa-save"></i> Save first</label>
    <input type="checkbox" id="node-input-saveOnReboot" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
</script>

<script type="text/html" data-help-name="netgear-proav-control">
  <p>Runs one NETGEAR Pro AV switch action using a shared switch config node.</p>
  <p>Use <strong>Command</strong> to filter the action list between read-only <strong>Get</strong> commands and state-changing <strong>Set</strong> commands.</p>
  <p>The configured action can be overridden with <code>msg.operation</code>. Inputs such as <code>msg.portId</code>, <code>msg.enabled</code>, <code>msg.description</code>, <code>msg.fanMode</code>, <code>msg.vlanId</code>, and <code>msg.config</code> override editor defaults.</p>
  <p>For port actions, the editor loads the available port IDs from the selected switch config node. The saved value is the switch API port ID, while the visible label uses the switch's port name and description where available. Port labels preserve the switch-reported form, including both <code>x/x</code> and <code>x/x/x</code> formats. Runtime <code>msg.portId</code> may use the numeric API ID or the same visible label.</p>
  <p>Fan mode options are <code>1</code> Off, <code>2</code> Quiet, and <code>3</code> Cool.</p>
  <p>The switch response is returned in <code>msg.payload</code>. The node also adds <code>msg.switch</code> with the configured switch name, host, and API port.</p>
  <p><strong>Be careful:</strong> port admin, PoE, save config, and reboot actions change switch state.</p>
</script>
