<script type="text/javascript">
  RED.nodes.registerType("netgear-proav-switch", {
    category: "config",
    defaults: {
      name: { value: "" },
      host: { value: "", required: true },
      port: { value: 443, required: true, validate: RED.validators.number() },
      verifySsl: { value: false },
      timeout: { value: 15000, required: true, validate: RED.validators.number() }
    },
    credentials: {
      username: { type: "text", required: true },
      password: { type: "password", required: true }
    },
    label: function () {
      return this.name || this.host || "NETGEAR Pro AV switch";
    }
  });

  RED.nodes.registerType("netgear-proav-control", {
    category: "network",
    color: "#3f6fb5",
    defaults: {
      name: { value: "" },
      switch: { value: "", type: "netgear-proav-switch", required: true },
      commandType: { value: "get", required: true },
      operation: { value: "deviceInfo", required: true },
      portId: { value: "" },
      enabled: { value: "" },
      description: { value: "" },
      fanMode: { value: "" },
      vlanId: { value: "" },
      statisticsType: { value: "errors" },
      domainName: { value: "" },
      ipAddr: { value: "" },
      ports: { value: "" },
      indexPage: { value: "" },
      pageSize: { value: "" },
      unit: { value: "" },
      saveOnReboot: { value: true }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-server",
    label: function () {
      return this.name || this.operation || "NETGEAR Pro AV control";
    },
    oneditprepare: function () {
      const operations = {
        get: [
          ["deviceInfo", "Device info"],
          ["portConfig", "Port config"],
          ["portConfigAll", "All port config"],
          ["portSummary", "Port summary"],
          ["portsStatus", "Ports status"],
          ["portStatus", "Port status"],
          ["portStatistics", "Port statistics"],
          ["fiberOptics", "Fiber optics"],
          ["fiberOpticsDiag", "Fiber diagnostics"],
          ["fiberOpticsEeprom", "Fiber EEPROM"],
          ["stpConfig", "STP config"],
          ["stpPortInfo", "STP port info"],
          ["multicastGroups", "Multicast groups"],
          ["multicastMode", "Multicast mode"],
          ["dnsLookup", "DNS lookup"],
          ["pingTest", "Ping test"],
          ["traceTest", "Traceroute test"],
          ["cableTest", "Cable test"],
          ["imageInfo", "Image info"],
          ["configStatus", "Config status"],
          ["neighbors", "LLDP neighbors"],
          ["profileList", "Profile list"],
          ["poeInfo", "PoE info"],
          ["poePortConfig", "PoE port config"],
          ["lagConfig", "LAG config"],
          ["stacking", "Stacking"],
          ["vlanMembership", "VLAN membership"]
        ],
        set: [
          ["saveConfig", "Save config"],
          ["reboot", "Reboot"],
          ["setFanMode", "Set fan mode"],
          ["setPortAdmin", "Set port admin"],
          ["setPortDescription", "Set port description"],
          ["setPoeEnabled", "Set PoE enabled"],
          ["resetPoe", "Reset PoE"]
        ]
      };
      const commandType = $("#node-input-commandType");
      const select = $("#node-input-operation");
      const switchSelect = $("#node-input-switch");
      const portSelect = $("#node-input-portId");
      const allOperations = operations.get.concat(operations.set).map(([value]) => value);
      const initialOperation = allOperations.includes(this.operation) ? this.operation : "deviceInfo";
      const initialType = operations.set.some(([value]) => value === initialOperation) ? "set" : "get";
      const initialPortId = this.portId || "";
      commandType.val(this.commandType || initialType);

      const populateOperations = function (selected) {
        const type = commandType.val() || "get";
        const current = selected || select.val() || initialOperation;
        const validCurrent = operations[type].some(([value]) => value === current);
        const nextValue = validCurrent ? current : operations[type][0][0];
        select.empty();
        for (const [value, label] of operations[type]) {
          $("<option></option>").val(value).text(label).appendTo(select);
        }
        select.val(nextValue);
      };

      const updateVisibility = function () {
        const op = select.val();
        $(".netgear-port-row").toggle(["portConfig", "poePortConfig", "setPortAdmin", "setPortDescription", "setPoeEnabled", "resetPoe"].includes(op));
        $(".netgear-enabled-row").toggle(["setPortAdmin", "setPoeEnabled"].includes(op));
        $(".netgear-description-row").toggle(op === "setPortDescription");
        $(".netgear-fan-row").toggle(op === "setFanMode");
        $(".netgear-vlan-row").toggle(op === "vlanMembership");
        $(".netgear-statistics-row").toggle(op === "portStatistics");
        $(".netgear-domain-row").toggle(op === "dnsLookup");
        $(".netgear-ip-row").toggle(["pingTest", "traceTest"].includes(op));
        $(".netgear-ports-row").toggle(op === "cableTest");
        $(".netgear-pagination-row").toggle(op === "multicastGroups");
        $(".netgear-reboot-row").toggle(op === "reboot");
      };

      const populatePorts = function () {
        const switchId = switchSelect.val();
        const current = portSelect.val() || initialPortId;
        portSelect.empty();
        $("<option></option>").val("").text("Use msg.portId").appendTo(portSelect);
        if (current) {
          $("<option></option>").val(current).text(`Current saved value (${current})`).appendTo(portSelect);
          portSelect.val(current);
        }
        if (!switchId || switchId === "_ADD_") {
          return;
        }
        $("<option></option>").val("").text("Loading ports...").prop("disabled", true).appendTo(portSelect);
        $.getJSON(`netgear-proav/switch/${encodeURIComponent(switchId)}/ports`)
          .done(function (data) {
            const selected = portSelect.val() || current;
            portSelect.empty();
            $("<option></option>").val("").text("Use msg.portId").appendTo(portSelect);
            for (const port of data.ports || []) {
              $("<option></option>").val(port.value).text(port.label || port.value).appendTo(portSelect);
            }
            const hasSelected = portSelect.find("option").filter(function () {
              return $(this).val() === selected;
            }).length > 0;
            if (selected && !hasSelected) {
              $("<option></option>").val(selected).text(`Current saved value (${selected})`).appendTo(portSelect);
            }
            portSelect.val(selected);
          })
          .fail(function (xhr) {
            portSelect.find("option:disabled").remove();
            const message = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : "Could not load ports";
            $("<option></option>").val("").text(message).prop("disabled", true).appendTo(portSelect);
          });
      };
      commandType.on("change", function () {
        populateOperations();
        updateVisibility();
      });
      select.on("change", updateVisibility);
      switchSelect.on("change", populatePorts);
      populateOperations(initialOperation);
      populatePorts();
      updateVisibility();
    }
  });
</script>

<script type="text/html" data-help-name="netgear-proav-switch">
  <p>Shared connection settings for one NETGEAR Pro AV switch.</p>
  <p>Create one switch config node per physical switch, then reference it from as many NETGEAR Pro AV control nodes as needed. The config node owns the authenticated session and refreshes it before the switch session token expires.</p>
  <p>Create a dedicated switch user for automation. Avoid using the built-in admin account if NETGEAR Engage or browser management may be used at the same time, because those sessions can interfere with each other.</p>
  <p>Most switches use HTTPS on port 443. If the switch uses its factory self-signed certificate, leave SSL verification disabled unless you have installed a trusted certificate.</p>
</script>

<script type="text/html" data-help-name="netgear-proav-control">
  <p>Runs one NETGEAR Pro AV switch action using a shared switch config node.</p>
  <p>Use <strong>Command</strong> to filter the action list between read-only <strong>Get</strong> commands and state-changing <strong>Set</strong> commands.</p>
  <p>The switch response is returned in <code>msg.payload</code>. The node also adds <code>msg.switch</code> with the configured switch name, host, and API port.</p>
  <p>The configured action can be overridden with <code>msg.operation</code>. Runtime inputs override editor defaults.</p>

  <h3>Common inputs</h3>
  <dl class="message-properties">
    <dt><code>msg.operation</code></dt>
    <dd>Overrides the configured action with any supported operation name.</dd>
    <dt><code>msg.portId</code> or <code>msg.payload.portId</code></dt>
    <dd>Port target for port-specific operations. May be the numeric API ID or the visible switch label, such as <code>7</code>, <code>0/7</code>, or <code>1/0/7</code>.</dd>
    <dt><code>msg.config</code> or <code>msg.payload.config</code></dt>
    <dd>Optional current port configuration row used by write operations to avoid an extra read.</dd>
  </dl>

  <h3>Get commands</h3>
  <dl>
    <dt><code>deviceInfo</code></dt>
    <dd>Reads switch inventory, firmware, uptime, fan, CPU, memory, PoE capability, and system-level details. No extra inputs.</dd>
    <dt><code>portConfig</code></dt>
    <dd>Reads full configuration for one port. Inputs: <code>msg.portId</code>.</dd>
    <dt><code>portConfigAll</code></dt>
    <dd>Reads full configuration for all physical ports. No extra inputs.</dd>
    <dt><code>portSummary</code></dt>
    <dd>Reads and shapes port config, status, compact state, statistics, fibre optics, PoE, LLDP, STP, and multicast subscriber data into <code>msg.payload.ports[portId]</code>. The <code>multicast</code> object includes <code>group_count</code>, <code>vlans</code>, <code>groups</code>, <code>subscribers</code>, and sorted <code>rows</code>. No extra inputs.</dd>
    <dt><code>portsStatus</code></dt>
    <dd>Reads detailed per-port status rows including admin state, link state, media type, profile, description, STP, and physical speed. No extra inputs.</dd>
    <dt><code>portStatus</code></dt>
    <dd>Reads compact per-port state and VLAN rows. No extra inputs.</dd>
    <dt><code>portStatistics</code></dt>
    <dd>Reads port counters and bandwidth data. Inputs: <code>msg.statisticsType</code>, <code>msg.payload.statisticsType</code>, or editor Type. Common values are <code>errors</code>, <code>inbound</code>, and <code>outbound</code>.</dd>
    <dt><code>fiberOptics</code></dt>
    <dd>Reads fibre/SFP inventory and live optical values where present. No extra inputs.</dd>
    <dt><code>fiberOpticsDiag</code></dt>
    <dd>Reads raw diagnostic data for fibre/SFP ports. No extra inputs.</dd>
    <dt><code>fiberOpticsEeprom</code></dt>
    <dd>Reads EEPROM/vendor data for fibre/SFP ports. No extra inputs.</dd>
    <dt><code>stpConfig</code></dt>
    <dd>Reads switch-level Spanning Tree Protocol details including root bridge, priority, topology changes, and timers. No extra inputs.</dd>
    <dt><code>stpPortInfo</code></dt>
    <dd>Reads per-port STP mode, edge status, forwarding state, and role. No extra inputs.</dd>
    <dt><code>multicastGroups</code></dt>
    <dd>Reads multicast group/subscriber rows. Rows are sorted by port, VLAN, multicast group, subscriber IP, subscriber MAC, and type. The response keeps rows in <code>msg.payload.multicastGroups.rows</code> and adds <code>byPort</code>, <code>byVlan</code>, and <code>byGroup</code> grouped views. Inputs: optional <code>msg.indexPage</code>, <code>msg.payload.indexPage</code>, <code>msg.pageSize</code>, <code>msg.payload.pageSize</code>, <code>msg.unit</code>, or <code>msg.payload.unit</code>. Defaults are page <code>1</code>, page size <code>9999</code>, and unit <code>1</code>.</dd>
    <dt><code>multicastMode</code></dt>
    <dd>Reads multicast mode for physical and LAG ports on models that populate this endpoint. Tested switches may return a successful but empty payload. No extra inputs.</dd>
    <dt><code>dnsLookup</code></dt>
    <dd>Runs a DNS lookup from the switch. Inputs: <code>msg.domainName</code> or <code>msg.payload.domainName</code>.</dd>
    <dt><code>pingTest</code></dt>
    <dd>Runs a ping from the switch. Inputs: <code>msg.ipAddr</code> or <code>msg.payload.ipAddr</code>.</dd>
    <dt><code>traceTest</code></dt>
    <dd>Runs a traceroute from the switch. Inputs: <code>msg.ipAddr</code> or <code>msg.payload.ipAddr</code>.</dd>
    <dt><code>cableTest</code></dt>
    <dd>Runs cable diagnostics against one or more physical ports. Inputs: <code>msg.ports</code> or <code>msg.payload.ports</code> as an array or comma-separated list of numeric API port IDs. Cable diagnostics may briefly affect the tested ports.</dd>
    <dt><code>imageInfo</code></dt>
    <dd>Reads firmware image information. No extra inputs.</dd>
    <dt><code>configStatus</code></dt>
    <dd>Reads device and image information, then reports whether the running configuration appears to need saving. The payload includes <code>configSaveNeeded</code>, <code>runningConfigMatchesSaved</code>, <code>source</code>, and the raw <code>deviceInfo</code>/<code>imageInfo</code> responses when available.</dd>
    <dt><code>neighbors</code></dt>
    <dd>Reads LLDP neighbor rows. No extra inputs.</dd>
    <dt><code>profileList</code></dt>
    <dd>Reads configured/active AV profile definitions. No extra inputs.</dd>
    <dt><code>poeInfo</code></dt>
    <dd>Reads switch-level PoE budget and consumption information. No extra inputs.</dd>
    <dt><code>poePortConfig</code></dt>
    <dd>Reads PoE configuration for one port. Inputs: <code>msg.portId</code>.</dd>
    <dt><code>lagConfig</code></dt>
    <dd>Reads link aggregation group configuration. No extra inputs.</dd>
    <dt><code>stacking</code></dt>
    <dd>Reads stack/member information where supported. No extra inputs.</dd>
    <dt><code>vlanMembership</code></dt>
    <dd>Reads VLAN membership for one VLAN. Inputs: <code>msg.vlanId</code> or <code>msg.payload.vlanId</code>.</dd>
  </dl>

  <h3>Set commands</h3>
  <dl>
    <dt><code>setPortAdmin</code></dt>
    <dd>Enables or disables a port administratively. Inputs: <code>msg.portId</code> and <code>msg.enabled</code> or <code>msg.payload.enabled</code>. Accepted booleans include <code>true</code>, <code>false</code>, <code>1</code>, <code>0</code>, <code>on</code>, and <code>off</code>.</dd>
    <dt><code>setPortDescription</code></dt>
    <dd>Sets one port description. Inputs: <code>msg.portId</code> and <code>msg.description</code> or <code>msg.payload.description</code>. Uses the extended single-port endpoint first, then falls back to the older bulk endpoint.</dd>
    <dt><code>setPoeEnabled</code></dt>
    <dd>Enables or disables PoE on one port. Inputs: <code>msg.portId</code> and <code>msg.enabled</code> or <code>msg.payload.enabled</code>.</dd>
    <dt><code>resetPoe</code></dt>
    <dd>Power-cycles PoE on one port. Inputs: <code>msg.portId</code> or <code>msg.payload.portId</code>. Optional <code>msg.config</code> or <code>msg.payload.config</code> can provide the current PoE row.</dd>
    <dt><code>setFanMode</code></dt>
    <dd>Sets switch fan mode. Inputs: <code>msg.fanMode</code> or <code>msg.payload.fanMode</code>. Values are <code>1</code> Off, <code>2</code> Quiet, and <code>3</code> Cool.</dd>
    <dt><code>saveConfig</code></dt>
    <dd>Saves the running switch configuration. No extra inputs. Some models return an empty successful response, in which case <code>msg.payload</code> is <code>null</code>.</dd>
    <dt><code>reboot</code></dt>
    <dd>Reboots the switch. Inputs: <code>msg.save</code> or <code>msg.payload.save</code> to control whether the switch saves first. If omitted, the editor <strong>Save first</strong> checkbox is used. Some models reboot before the HTTP response is returned, so a network error can still mean the reboot command was accepted.</dd>
  </dl>

  <h3>Port labels</h3>
  <p>For port actions, the editor loads available ports from the selected switch config node. The saved value is the switch API port ID, while the visible label uses the switch's port name and description where available. Port labels preserve the switch-reported form, including both <code>x/x</code> and <code>x/x/x</code> formats.</p>
  <p><strong>Be careful:</strong> port admin, PoE, save config, and reboot actions change switch state.</p>
</script>
